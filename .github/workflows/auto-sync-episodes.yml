name: Auto-Sync Crunchyroll Skip Timestamps

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual trigger at any time from GitHub UI

permissions:
  contents: write

jobs:
  sync-episodes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Auto-Sync Engine (Crunchyroll New Releases & Airing)
        run: |
          node scripts/sync-new-releases.mjs
          node scripts/run-auto-sync.mjs
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}

      - name: Commit and Push Database Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s data/aniskip_data.json data/editor-history.json) ]]; then
            git add data/aniskip_data.json data/editor-history.json
            git commit -m "chore(auto-sync): update crunchyroll new releases & airing skip timestamps [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "Updates committed and pushed successfully."
          else
            echo "No new episodes or timestamp updates found. Database is up to date."
          fi
